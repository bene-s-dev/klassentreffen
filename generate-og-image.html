<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>OG Image Merian-Klassentreffen 2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1280px;
      height: 720px;
      background-color: #020617;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .glow-1 {
      position: absolute;
      top: -10%;
      left: 10%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217, 70, 239, 0.35) 0%, transparent 70%);
      filter: blur(80px);
    }

    .glow-2 {
      position: absolute;
      bottom: -10%;
      right: 10%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.32) 0%, transparent 70%);
      filter: blur(85px);
    }

    .particle {
      position: absolute;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 1120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 22px;
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(245, 158, 11, 0.5);
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fbbf24;
      margin-bottom: 16px;
    }

    .pulse-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #34d399;
    }

    .main-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 52px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 22px;
    }

    .title-sub {
      font-size: 32px;
      font-weight: 700;
      color: #e2e8f0;
      display: block;
      margin-bottom: 2px;
    }

    .title-highlight {
      background: linear-gradient(115deg, #ffffff 0%, #f472b6 25%, #d946ef 55%, #c084fc 80%, #ffffff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 24px rgba(217, 70, 239, 0.55));
    }

    .result-card {
      width: 100%;
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.94) 0%, rgba(30, 27, 75, 0.88) 50%, rgba(15, 23, 42, 0.96) 100%);
      border: 1.8px solid rgba(245, 158, 11, 0.55);
      border-radius: 32px;
      padding: 34px 44px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 70px -10px rgba(0, 0, 0, 0.85), 0 0 50px rgba(245, 158, 11, 0.2);
    }

    .card-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 800;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      margin-bottom: 14px;
      padding: 6px 18px;
      background: rgba(245, 158, 11, 0.12);
      border: 1.2px solid rgba(245, 158, 11, 0.35);
      border-radius: 9999px;
    }

    .date-heading {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 64px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.035em;
      line-height: 1.1;
      margin-bottom: 22px;
    }

    .date-accent {
      display: inline-block;
      padding-left: 4px;
      padding-right: 10px;
      background: linear-gradient(120deg, #ffffff 0%, #fed7aa 25%, #f472b6 65%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 24px rgba(244, 114, 182, 0.7));
    }

    .details-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .detail-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px;
      background: rgba(30, 41, 59, 0.75);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      font-size: 19px;
      font-weight: 700;
      color: #ffffff;
    }

    .detail-pill.highlight-time {
      background: linear-gradient(135deg, rgba(217, 70, 239, 0.35) 0%, rgba(147, 51, 234, 0.45) 100%);
      border: 1.8px solid rgba(217, 70, 239, 0.75);
      box-shadow: 0 8px 25px rgba(192, 38, 211, 0.35);
    }

    .icon-svg {
      width: 22px;
      height: 22px;
    }

    .slogan-text {
      font-size: 17px;
      font-weight: 600;
      color: #cbd5e1;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <!-- Festive Confetti Decor -->
  <svg class="particle" style="top: 40px; left: 60px; width: 28px; height: 28px;" viewBox="0 0 24 24" fill="none">
    <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="#f472b6" opacity="0.8"/>
  </svg>
  <svg class="particle" style="top: 50px; right: 70px; width: 32px; height: 32px;" viewBox="0 0 24 24" fill="none">
    <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="#c084fc" opacity="0.85"/>
  </svg>
  <div class="particle" style="bottom: 45px; left: 80px; width: 12px; height: 12px; background: #fbbf24; border-radius: 3px; transform: rotate(15deg); opacity: 0.8;"></div>
  <div class="particle" style="bottom: 50px; right: 90px; width: 10px; height: 10px; background: #f472b6; border-radius: 50%; opacity: 0.85;"></div>

  <div class="container">
    <div class="status-badge">
      <span class="pulse-dot"></span>
      Abstimmung beendet • Das Ergebnis steht fest!
    </div>

    <h1 class="main-title">
      <span class="title-sub">Merian-</span>
      <span class="title-highlight">Klassentreffen 2.0</span>
    </h1>

    <div class="result-card">
      <div class="card-kicker">
        <!-- Lucide Trophy -->
        <svg style="width: 17px; height: 17px; color: #fbbf24;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
          <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
          <path d="M4 22h16"/>
          <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
          <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
          <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
        </svg>
        <span>Offizieller Termin</span>
        <!-- Lucide Sparkles -->
        <svg style="width: 17px; height: 17px; color: #fbbf24;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
        </svg>
      </div>

      <h2 class="date-heading">
        Samstag, <span class="date-accent">3. April</span>
      </h2>

      <div class="details-row">
        <div class="detail-pill highlight-time">
          <svg class="icon-svg" style="color: #f472b6;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span style="color: #fff; font-weight: 800;">ab 19:00 Uhr</span>
        </div>

        <div class="detail-pill">
          <svg class="icon-svg" style="color: #38bdf8;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span>Freiburg im Breisgau</span>
        </div>

        <div class="detail-pill">
          <svg class="icon-svg" style="color: #fbbf24;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"/>
            <path d="M15 2v10"/>
            <path d="M15 12v9"/>
            <path d="M6 2v20"/>
            <path d="M6 2a5 5 0 0 1 5 5v3a2 2 0 0 1-2 2H6"/>
          </svg>
          <span>Bar & Restaurant</span>
        </div>
      </div>

      <p class="slogan-text">„Lowkey Pflichttermin – Wer schwänzt ist eh komplett lost! 💀“</p>
    </div>
  </div>
</body>
</html>
